<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#FAF6EF;
  --surface:#FFFFFF;
  --text:#2B2823;
  --text-muted:#7A7264;
  --primary:#33513E;
  --primary-light:#4A6F55;
  --primary-wash:#E8EEE8;
  --accent:#A8562F;
  --accent-wash:#F3E3D5;
  --border:#E6DFD0;
  --danger:#B3402B;
  --internet:#2F6F76;
  --internet-wash:#E2EEEF;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
h1,h2,h3{margin:0;font-weight:600;color:var(--text);}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}

/* ---------- layout shell ---------- */
#app{
  max-width:640px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:calc(84px + var(--safe-bottom));
  position:relative;
}

header.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  padding:calc(18px + env(safe-area-inset-top)) 20px 14px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.title-block{display:flex; align-items:center; gap:10px;}
.app-logo{width:40px; height:40px; border-radius:11px; box-shadow:0 1px 4px rgba(43,40,35,0.15); flex-shrink:0;}
header.topbar .title-block h1{font-size:26px; font-style:italic; letter-spacing:-0.01em;}
header.topbar .title-block .tagline{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
.icon-btn{
  border:none; background:var(--surface); width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; color:var(--primary);
  box-shadow:0 1px 3px rgba(43,40,35,0.08); cursor:pointer;
}
.icon-btn svg{width:19px;height:19px;}

main{padding:16px 16px 8px;}

/* ---------- bottom nav ---------- */
nav.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  max-width:640px; margin:0 auto;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:var(--safe-bottom);
  box-shadow:0 -2px 10px rgba(43,40,35,0.05);
}
nav.tabbar button{
  flex:1; border:none; background:none; padding:10px 2px 8px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  color:var(--text-muted); cursor:pointer;
}
nav.tabbar button svg{width:22px;height:22px;}
nav.tabbar button span{font-size:10.5px; font-weight:500;}
nav.tabbar button.active{color:var(--primary);}
nav.tabbar button.active svg{transform:translateY(-1px);}

/* ---------- generic cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:16px; margin-bottom:14px;
}
.section-title{font-size:13px; text-transform:none; color:var(--text-muted); margin-bottom:8px; font-weight:500;}
.muted{color:var(--text-muted);}
.pill{
  display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:99px;
  font-size:12px; font-weight:500; background:var(--primary-wash); color:var(--primary);
}
.pill.accent{background:var(--accent-wash); color:var(--accent);}
.row{display:flex; align-items:center; gap:8px;}
.row.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}

.btn{
  border:none; border-radius:var(--radius-s); padding:10px 14px; font-size:14px; font-weight:600;
  cursor:pointer; display:inline-flex; align-items:center; gap:6px; justify-content:center;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-soft{background:var(--primary-wash); color:var(--primary);}
.btn-accent{background:var(--accent); color:#fff;}
.btn-internet{background:var(--internet-wash); color:var(--internet);}
.btn-stockpick{background:var(--primary-wash); color:var(--primary); border:1px dashed var(--primary-light);}
.btn-ghost{background:transparent; color:var(--text-muted); border:1px solid var(--border);}
.btn-danger{background:#fff; color:var(--danger); border:1px solid #ecd3cb;}
.btn-block{width:100%;}
.btn-sm{padding:7px 11px; font-size:12.5px; border-radius:8px;}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-s);
  background:var(--bg); color:var(--text); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary-light);}
label.field-label{font-size:12.5px; color:var(--text-muted); display:block; margin-bottom:4px; font-weight:500;}
.field{margin-bottom:12px;}
textarea{min-height:90px; resize:vertical;}

/* ---------- week nav ---------- */
.week-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.week-nav .week-label{font-size:14.5px; font-weight:600;}
.week-nav button{
  background:var(--surface); border:1px solid var(--border); width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.week-nav button svg{width:16px;height:16px;}

.day-card{margin-bottom:14px;}
.day-card .day-head{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;}
.day-card .day-head .dow{font-family:'Fraunces',serif; font-size:17px; font-weight:600;}
.day-card .day-head .ddate{font-size:12.5px; color:var(--text-muted);}
.day-card.today{border-color:var(--primary-light); box-shadow:0 0 0 1.5px var(--primary-light) inset;}

.meal-row{border-top:1px solid var(--border); padding:12px 0;}
.meal-row:first-of-type{border-top:none; padding-top:2px;}
.meal-row .meal-label{font-size:12px; font-weight:600; color:var(--primary); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.meal-row .meal-body{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.meal-row .recipe-name{font-size:14.5px; font-weight:600;}
.meal-row .recipe-kcal{font-size:12px; color:var(--text-muted);}
.meal-row .empty-slot{font-size:13.5px; color:var(--text-muted); font-style:italic;}
.meal-actions{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
.obj-input{width:74px; padding:6px 8px; font-size:12.5px; text-align:center;}
.realise-toggle{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); cursor:pointer; user-select:none;}
.realise-toggle input{width:16px;height:16px; accent-color:var(--primary);}

/* ---------- recipes ---------- */
.recipe-card{cursor:pointer;}
.recipe-card .rname{font-size:15.5px; font-weight:600;}
.type-chip{
  border:1px solid var(--border); background:var(--surface); border-radius:99px; padding:6px 13px;
  font-size:12.5px; font-weight:500; cursor:pointer; color:var(--text-muted);
}
.type-chip.on{background:var(--primary); color:#fff; border-color:var(--primary);}
.search-box{position:relative; margin-bottom:12px;}
.search-box input{padding-left:34px;}
.search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-muted);}

/* ---------- stock ---------- */
.stock-item{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-top:1px solid var(--border);}
.stock-item:first-of-type{border-top:none;}
.stock-item .sname{font-size:14px; font-weight:500;}
.stock-item .sqty{font-size:12px; color:var(--text-muted);}
.stepper{display:flex; align-items:center; gap:8px;}
.stepper button{width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--bg); cursor:pointer; font-size:15px; line-height:1; color:var(--primary);}

/* ---------- courses ---------- */
.course-item{display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--border);}
.course-item:first-of-type{border-top:none;}
.course-item input[type=checkbox]{width:19px; height:19px; accent-color:var(--primary); flex-shrink:0;}
.course-item .cname{flex:1; font-size:14.5px;}
.course-item.checked .cname{color:var(--text-muted); text-decoration:line-through;}
.course-item .cqty{font-size:12px; color:var(--text-muted);}

/* ---------- historique ---------- */
.hist-item{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-top:1px solid var(--border);}
.hist-item:first-of-type{border-top:none;}
.hist-item .hname{font-size:14px; font-weight:600;}
.hist-item .hdate{font-size:12px; color:var(--text-muted);}

/* ---------- modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(43,40,35,0.42); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.modal-backdrop.open{opacity:1; pointer-events:auto;}
.modal-sheet{
  background:var(--bg); width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
  border-radius:22px 22px 0 0; padding:18px 18px calc(24px + var(--safe-bottom));
  transform:translateY(24px); transition:transform .2s ease;
}
.modal-backdrop.open .modal-sheet{transform:translateY(0);}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h2{font-size:19px;}
.modal-close{background:var(--surface); border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; color:var(--text-muted); font-size:17px;}
.ing-row{display:grid; grid-template-columns:1fr 64px 74px 30px; gap:6px; margin-bottom:7px; align-items:center;}
.ing-row input{padding:8px 9px; font-size:13.5px;}
.small-x{background:none; border:none; color:var(--danger); font-size:18px; cursor:pointer; padding:0;}

.empty-state{text-align:center; padding:38px 14px; color:var(--text-muted);}
.empty-state svg{width:34px; height:34px; margin-bottom:10px; opacity:.5;}
.empty-state p{font-size:13.5px; line-height:1.5;}

.fab-add{margin-top:2px;}
.hint{font-size:12px; color:var(--text-muted); line-height:1.5; margin-top:6px;}
</style>
</head>

/* Connexion Firestore — module séparé car le SDK Firebase s'utilise
   avec des imports ES. Il expose des fonctions sur window pour que
   le script principal (classique, plus bas) puisse les appeler,
   et prévient ce dernier via l'événement 'firestore-ready'. */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyDZVBzw6L5uO6s5OsrywhPMmYmHHk1IWvs',
  authDomain: 'menu-8e939.firebaseapp.com',
  databaseURL: 'https://menu-8e939-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'menu-8e939',
  storageBucket: 'menu-8e939.firebasestorage.app',
  messagingSenderId: '984195885838',
  appId: '1:984195885838:web:9522c6216796071f73c55f'
};

window.__firestoreEnabled = !!(firebaseConfig.apiKey && firebaseConfig.apiKey !== 'REMPLACE_MOI');

if(window.__firestoreEnabled){
  try{
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const sharedDoc = doc(db, 'nosmenus', 'famille');

    window.__firestoreWrite = async (payload)=>{
      await setDoc(sharedDoc, payload);
    };
    window.__firestoreRead = async ()=>{
      const snap = await getDoc(sharedDoc);
      if(!snap.exists()) throw new Error('Aucune donnée trouvée dans l\u2019espace partagé pour l\u2019instant.');
      return snap.data();
    };
    /* Écoute en temps réel : callback appelé à chaque changement venant
       du serveur (donc de l'autre téléphone). On ignore les échos de nos
       propres écritures locales (hasPendingWrites) pour éviter les
       allers-retours inutiles. */
    window.__firestoreListen = (onChange)=>{
      onSnapshot(sharedDoc, (snap)=>{
        if(snap.metadata.hasPendingWrites) return;
        if(snap.exists()) onChange(snap.data());
      }, (err)=>{
        console.error('Flux temps réel interrompu', err);
      });
    };
  }catch(e){
    console.error('Initialisation Firebase impossible', e);
    window.__firestoreEnabled = false;
  }
}
window.dispatchEvent(new Event('firestore-ready'));

function defaultData(){
  return { recipes: [], menu: {}, stock: {congelateur:[], frigo:[], conserves:[]}, courses: [], historique: [] };
}

let data = loadData();

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultData(), parsed);
  }catch(e){
    return defaultData();
  }
}
function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    console.error('Sauvegarde impossible', e);
  }
  scheduleCloudPush();
}

/* ============================================================
   ESPACE PARTAGÉ (synchronisation à deux en temps réel, via
   Firestore). Dès qu'une donnée change ici, elle est envoyée
   (avec un léger délai pour grouper les modifications rapprochées)
   et l'autre téléphone la reçoit automatiquement, sans bouton à
   appuyer. Un indicateur "applyingRemote" évite qu'une donnée
   reçue soit aussitôt renvoyée en écho.
============================================================ */
function syncEnabled(){ return !!window.__firestoreEnabled; }

let syncMeta = loadSyncMeta();
function loadSyncMeta(){
  try{
    const raw = localStorage.getItem(SYNC_KEY);
    return raw ? JSON.parse(raw) : {lastSync:null};
  }catch(e){ return {lastSync:null}; }
}
function saveSyncMeta(){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(syncMeta)); }
  catch(e){ console.error('Sauvegarde de la config de synchro impossible', e); }
}

let applyingRemote = false;
let pushDebounceTimer = null;

function scheduleCloudPush(){
  if(!syncEnabled() || applyingRemote) return;
  clearTimeout(pushDebounceTimer);
  pushDebounceTimer = setTimeout(pushToCloudSilent, 700);
}

/* Filet de sécurité : Firestore refuse tout champ valant undefined
   quelque part dans l'objet, et rejette alors l'écriture ENTIÈRE
   silencieusement si on ne le rattrape pas. On nettoie donc toujours
   juste avant l'envoi, quelle que soit l'origine de la donnée. */
function stripUndefinedDeep(value){
  if(Array.isArray(value)) return value.map(stripUndefinedDeep);
  if(value && typeof value === 'object'){
    const out = {};
    Object.keys(value).forEach(k=>{
      if(value[k] !== undefined) out[k] = stripUndefinedDeep(value[k]);
    });
    return out;
  }
  return value;
}

async function pushToCloudSilent(){
  try{
    await window.__firestoreWrite(stripUndefinedDeep(data));
    syncMeta.lastSync = new Date().toISOString();
    saveSyncMeta();
  }catch(e){
    console.error('Envoi automatique échoué', e);
  }
}

function applyRemoteUpdate(remoteData){
  if(JSON.stringify(remoteData) === JSON.stringify(data)) return;
  applyingRemote = true;
  data = Object.assign(defaultData(), remoteData);
  saveData();
  applyingRemote = false;
  syncMeta.lastSync = new Date().toISOString();
  saveSyncMeta();
  const modalOpen = document.getElementById('modalBackdrop').classList.contains('open');
  if(!modalOpen) render();
}

function startRealtimeSync(){
  if(!syncEnabled()) return;
  window.__firestoreListen(applyRemoteUpdate);
}

function waitForFirestoreReady(timeoutMs){
  return new Promise(resolve=>{
    if(window.__firestoreEnabled !== undefined){ resolve(); return; }
    let done = false;
    window.addEventListener('firestore-ready', ()=>{ if(!done){ done=true; resolve(); } }, {once:true});
    setTimeout(()=>{ if(!done){ done=true; resolve(); } }, timeoutMs);
  });
}

/* Fusionne deux tableaux par une clé (le distant l'emporte en cas de
   doublon) — utilisé pour ne rien perdre au tout premier contact avec
   l'espace partagé, plutôt que d'écraser aveuglément l'un ou l'autre. */
function mergeByKey(localArr, remoteArr, keyFn){
  const map = new Map();
  (localArr||[]).forEach(item=>{ try{ map.set(keyFn(item), item); }catch(e){} });
  (remoteArr||[]).forEach(item=>{ try{ map.set(keyFn(item), item); }catch(e){} });
  return Array.from(map.values());
}

function mergeStates(local, remote){
  const merged = defaultData();
  merged.recipes = mergeByKey(local.recipes, remote.recipes, r=>r.nom.trim().toLowerCase());
  merged.historique = mergeByKey(local.historique, remote.historique, h=>h.id);
  merged.courses = mergeByKey(local.courses, remote.courses, c=>c.id);
  merged.stock = {};
  STOCK_ZONES.forEach(z=>{
    merged.stock[z.key] = mergeByKey((local.stock&&local.stock[z.key])||[], (remote.stock&&remote.stock[z.key])||[], i=>i.id);
  });
  merged.menu = {};
  const dates = new Set([...Object.keys(local.menu||{}), ...Object.keys(remote.menu||{})]);
  dates.forEach(d=>{
    const dayMerged = {};
    MEAL_TYPES.forEach(mt=>{
      const l = local.menu && local.menu[d] && local.menu[d][mt.key];
      const r = remote.menu && remote.menu[d] && remote.menu[d][mt.key];
      const slot = r || l;
      if(slot) dayMerged[mt.key] = slot;
    });
    if(Object.keys(dayMerged).length) merged.menu[d] = dayMerged;
  });
  return merged;
}

/* Premier contact avec l'espace partagé : on lit ce qui existe déjà
   côté cloud et on FUSIONNE avec les données locales, au lieu de
   pousser aveuglément les données locales (ce qui écraserait les
   recettes ajoutées par l'autre personne si ce push arrivait avant
   d'avoir reçu les siennes). Seul le tout premier appareil à se
   connecter (aucune donnée cloud du tout) sème les recettes de départ. */
async function initialCloudSync(){
  if(!syncEnabled()){ seedIfEmpty(); return; }
  try{
    const remote = await window.__firestoreRead();
    applyingRemote = true;
    data = mergeStates(data, remote);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    applyingRemote = false;
    syncMeta.lastSync = new Date().toISOString();
    saveSyncMeta();
    scheduleCloudPush(); // renvoie la fusion si elle contenait du nouveau
  }catch(e){
    if(e && e.message && e.message.indexOf('Aucune donnée trouvée') !== -1){
      seedIfEmpty();
    } else {
      console.error('Lecture initiale de l\u2019espace partagé impossible', e);
    }
  }
}

async function boot(){
  render(); // affichage immédiat avec les données en cache local
  await waitForFirestoreReady(4000);
  await initialCloudSync();
  startRealtimeSync();
  render(); // corrige l'affichage si la fusion a changé quelque chose
}

/* ============================================================
   UTILITAIRES DATE
============================================================ */
function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return isoDate(new Date()); }
function mondayOf(date){
  const d = new Date(date);
  const day = (d.getDay()+6)%7; // 0 = lundi
  d.setDate(d.getDate()-day);
  d.setHours(0,0,0,0);
  return d;
}
function addDays(date,n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
function humanDate(iso){
  const [y,m,d]=iso.split('-').map(Number);
  return `${d} ${MOIS[m-1]} ${y}`;
}
function weekDates(refMonday){
  return Array.from({length:7},(_,i)=>isoDate(addDays(refMonday,i)));
}

function getSlot(dateISO, mealKey){
  return (data.menu[dateISO] && data.menu[dateISO][mealKey]) || null;

function ensureSlot(dateISO, mealKey){

  if(!data.menu[dateISO][mealKey]) data.menu[dateISO][mealKey] = {recipeId:null, objectif:null, realise:false};
  return data.menu[dateISO][mealKey];
}

function chooseRandom(dateISO, mealKey){
  const objSlot = getSlot(dateISO, mealKey);
  const objectif = objSlot ? objSlot.objectif : null;
  let candidates = data.recipes.filter(r=>r.types.includes(mealKey));
  if(!candidates.length){
    toast('Aucune recette disponible pour ce repas.');
    return;
  }
  if(objectif){
    const withCal = candidates.filter(r=>r.calories);
    if(withCal.length){
      const tolerance = Math.max(120, objectif*0.2);
      const near = withCal.filter(r=>Math.abs(r.calories-objectif)<=tolerance);
      if(near.length) candidates = near;
    }
  }
  // favoriser les recettes les moins cuisinées récemment
  const withLast = candidates.map(r=>{
    const entries = data.historique.filter(h=>h.recipeId===r.id).map(h=>h.date).sort();
    return {r, last: entries.length ? entries[entries.length-1] : ''};
  }).sort((a,b)=> a.last.localeCompare(b.last));
  const poolSize = Math.max(1, Math.ceil(withLast.length/2));
  const pool = withLast.slice(0, poolSize);
  const choice = pool[Math.floor(Math.random()*pool.length)].r;
  const slot = ensureSlot(dateISO, mealKey);
  slot.recipeId = choice.id;
  saveData();
  render();
}

/* ---- Suggestion « Depuis le stock » ---- */
function stockCoverage(recipe){
  const allStock = [...data.stock.congelateur, ...data.stock.frigo, ...data.stock.conserves];
  const stockNames = allStock.filter(s=>Number(s.quantite)>0).map(s=>s.nom.trim().toLowerCase()).filter(Boolean);
  let matched = 0;
  const details = (recipe.ingredients||[]).map(ing=>{
    const nameL = ing.nom.trim().toLowerCase();
    const inStock = !!nameL && stockNames.some(sn=> sn===nameL || sn.includes(nameL) || nameL.includes(sn));
    if(inStock) matched++;
    return {nom:ing.nom, quantite:ing.quantite, unite:ing.unite, inStock};
  });
  return {matched, total: details.length, details};
}

function openStockSuggestion(dateISO, mealKey, excludeName){
  const personal = data.recipes.filter(r=>r.types.includes(mealKey) && r.ingredients && r.ingredients.length);
  const internet = INTERNET_RECIPES.filter(r=>r.types.includes(mealKey));
  let all = [...personal, ...internet].filter(r=>r.nom!==excludeName);
  if(!all.length) all = [...personal, ...internet];
  if(!all.length){ toast('Aucune recette avec ingrédients disponible pour ce repas. Ajoute des ingrédients à tes recettes, ou essaie « Internet ».'); return; }
  const scored = all.map(r=>({r, cov: stockCoverage(r)})).sort((a,b)=>{
    const ra = a.cov.total ? a.cov.matched/a.cov.total : 0;
    const rb = b.cov.total ? b.cov.matched/b.cov.total : 0;
    return rb-ra;
  });
  const top = scored.slice(0, Math.min(3, scored.length));
  const chosen = pickRandomFrom(top);
  renderSuggestionModal(chosen.r, dateISO, mealKey, 'stock', chosen.cov);
}

/* ---- Modal commun aux deux suggestions ---- */

    <div class="section-title">Ingrédients</div>
    <div style="margin-bottom:12px;">${ingHtml || '<p class="muted" style="font-size:13px;">Ingrédients non détaillés.</p>'}</div>
    ${recipe.instructions?`<div class="section-title">Préparation</div><p style="font-size:13.5px; line-height:1.6; margin-bottom:12px;">${esc(recipe.instructions)}</p>`:''}
    ${recipe.source?`<p class="hint" style="margin-bottom:14px;">Idée trouvée sur <a href="${recipe.source.url}" target="_blank" rel="noopener" style="color:var(--internet);">${esc(recipe.source.label)}</a>.</p>`:''}
    <button class="btn btn-primary btn-block" data-act="useSuggestion">Utiliser pour ce repas</button>

      if(mode==='internet') openInternetSuggestion(dateISO, mealKey, recipe.nom);
      else openStockSuggestion(dateISO, mealKey, recipe.nom);
    };

}

function ensureRecipeInLibrary(recipe){
  const existing = data.recipes.find(r=>r.nom.trim().toLowerCase()===recipe.nom.trim().toLowerCase());
  if(existing) return existing;
  const copy = {
    id: uid(), nom: recipe.nom, types: recipe.types.slice(),
    calories: recipe.calories || null,
    ingredients: (recipe.ingredients||[]).map(i=>({...i})),
    instructions: recipe.instructions || '',
    notes: recipe.notes || '',
    airFryer: !!recipe.airFryer,
    source: recipe.source ? {...recipe.source} : null
  };
  data.recipes.push(copy);
  return copy;
}

function applySuggestion(recipe, dateISO, mealKey, opts){
  opts = opts || {};
  const saved = ensureRecipeInLibrary(recipe);
  const slot = ensureSlot(dateISO, mealKey);
  slot.recipeId = saved.id;
  saveData();
  if(opts.addMissing){
    const cov = stockCoverage(saved);
    let added = 0;
    cov.details.filter(d=>!d.inStock).forEach(ing=>{
      const nameL = ing.nom.trim().toLowerCase();
      if(!nameL) return;
      const already = data.courses.some(c=>c.nom.trim().toLowerCase()===nameL);
      if(!already){
        data.courses.unshift({id:uid(), nom:ing.nom.trim(), quantite:[ing.quantite,ing.unite].filter(Boolean).join(' '), coche:false, manuel:false});
        added++;
      }
    });
    saveData();
    toast(added ? `${saved.nom} ajoutée au menu · ${added} ingrédient(s) ajouté(s) aux courses.` : `${saved.nom} ajoutée au menu. Tout est déjà dans ton stock !`);
  } else {
    toast(`${saved.nom} ajoutée au menu.`);
  }
}

function attachMenuEvents(){
  const main = document.getElementById('main');
  main.querySelectorAll('button[data-act="prevWeek"]').forEach(b=>b.onclick=()=>{weekOffset--; render();});
  main.querySelectorAll('button[data-act="nextWeek"]').forEach(b=>b.onclick=()=>{weekOffset++; render();});

  main.querySelectorAll('button[data-act="choisir"]').forEach(b=>b.onclick=()=>{
    const {date, meal} = b.dataset;
    openModal(pickerModalHTML(date, meal), sheet=>{
      let airFryerOnly = false;
      function wirePicks(){
        sheet.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{
          const slot = ensureSlot(date, meal);
          slot.recipeId = el.dataset.pick;
          saveData();
          closeModal();
          render();
        });
      }
      wirePicks();
      sheet.querySelector('#pickerAirFryerToggle').onclick = (e)=>{
        airFryerOnly = !airFryerOnly;
        e.target.classList.toggle('on');
        sheet.querySelector('#pickerList').innerHTML = pickerListHTML(meal, airFryerOnly);
        wirePicks();
      };
      sheet.querySelector('[data-act="closeModal"]').onclick = closeModal;
    });
  });

  main.querySelectorAll('button[data-act="aleatoire"]').forEach(b=>b.onclick=()=>{
    chooseRandom(b.dataset.date, b.dataset.meal);
  });

  main.querySelectorAll('button[data-act="internet"]').forEach(b=>b.onclick=()=>{
    openInternetSuggestion(b.dataset.date, b.dataset.meal);
  });

  main.querySelectorAll('button[data-act="stock"]').forEach(b=>b.onclick=()=>{
    openStockSuggestion(b.dataset.date, b.dataset.meal);
  });

  main.querySelectorAll('button[data-act="effacer"]').forEach(b=>b.onclick=()=>{
    const slot = ensureSlot(b.dataset.date, b.dataset.meal);
    slot.recipeId = null; slot.realise = false;
    saveData(); render();
  });

  main.querySelectorAll('input[data-act="objectif"]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const slot = ensureSlot(inp.dataset.date, inp.dataset.meal);
      slot.objectif = inp.value ? Number(inp.value) : null;
      saveData();
    });
  });

  main.querySelectorAll('input[data-act="realise"]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const {date, meal} = cb.dataset;
      const slot = ensureSlot(date, meal);
      slot.realise = cb.checked;
      if(cb.checked){
        const exists = data.historique.find(h=>h.date===date && h.type===meal && h.recipeId===slot.recipeId);
        if(!exists){
          data.historique.push({id:uid(), date, type:meal, recipeId:slot.recipeId, note:''});
        }
      } else {
        data.historique = data.historique.filter(h=>!(h.date===date && h.type===meal && h.recipeId===slot.recipeId));
      }
      saveData();
      render();
    });
  });
}

function openRecipeForm(recipe){
  openModal(recipeFormHTML(recipe), sheet=>{
    let selectedTypes = new Set(recipe ? recipe.types : []);
    let airFryerOn = !!(recipe && recipe.airFryer);
    sheet.querySelector('[data-act="closeModal"]').onclick = closeModal;
    sheet.querySelectorAll('[data-toggletype]').forEach(chip=>{
      chip.onclick = ()=>{
        const t = chip.dataset.toggletype;
        if(selectedTypes.has(t)) selectedTypes.delete(t); else selectedTypes.add(t);
        chip.classList.toggle('on');
      };
    });
    sheet.querySelector('#rf-airfryer').onclick = (e)=>{
      airFryerOn = !airFryerOn;
      e.target.classList.toggle('on');
    };
    function addIngRow(){
      const div = document.createElement('div');
      div.className='ing-row'; div.setAttribute('data-ingrow','');
      div.innerHTML = `<input type="text" placeholder="Ingrédient" data-ing="nom">
        <input type="text" placeholder="Qté" data-ing="quantite">
        <input type="text" placeholder="Unité" data-ing="unite">
        <button type="button" class="small-x" data-act="removeIng">&times;</button>`;
      sheet.querySelector('#ingList').appendChild(div);
      div.querySelector('[data-act="removeIng"]').onclick=()=>div.remove();
    }
    sheet.querySelector('[data-act="addIng"]').onclick = addIngRow;
    sheet.querySelectorAll('[data-act="removeIng"]').forEach(b=>b.onclick=()=>b.closest('[data-ingrow]').remove());

    if(recipe){
      sheet.querySelector('[data-act="deleteRecipe"]').onclick = ()=>{
        if(confirm('Supprimer définitivement cette recette ?')){
          data.recipes = data.recipes.filter(r=>r.id!==recipe.id);
          saveData(); closeModal(); render();
        }
      };
    }

    sheet.querySelector('#recipeForm').addEventListener('submit', e=>{
      e.preventDefault();
      const nom = sheet.querySelector('#rf-nom').value.trim();
      if(!nom) return;
      const ingredients = Array.from(sheet.querySelectorAll('[data-ingrow]')).map(row=>({
        nom: row.querySelector('[data-ing="nom"]').value.trim(),
        quantite: row.querySelector('[data-ing="quantite"]').value.trim(),
        unite: row.querySelector('[data-ing="unite"]').value.trim()
      })).filter(i=>i.nom);
      const payload = {
        id: recipe ? recipe.id : uid(),
        nom,
        types: Array.from(selectedTypes),
        calories: sheet.querySelector('#rf-cal').value ? Number(sheet.querySelector('#rf-cal').value) : null,
        ingredients,
        instructions: sheet.querySelector('#rf-instr').value.trim(),
        notes: sheet.querySelector('#rf-notes').value.trim(),
        airFryer: airFryerOn,
        source: recipe && recipe.source ? recipe.source : null
      };
      if(recipe){
        const idx = data.recipes.findIndex(r=>r.id===recipe.id);
        data.recipes[idx] = payload;
      } else {
        data.recipes.push(payload);
      }
      saveData();
      closeModal();
      render();
    });
  });
}

function generateCourses(){
  const monday = mondayOf(addDays(new Date(), weekOffset*7));
  const dates = weekDates(monday);
  const needed = {}; // nom lower -> {nom, qtys:[strings]}
  dates.forEach(dateISO=>{
    const dayMenu = data.menu[dateISO];
    if(!dayMenu) return;
    MEAL_TYPES.forEach(mt=>{
      const slot = dayMenu[mt.key];
      if(slot && slot.recipeId){
        const recipe = data.recipes.find(r=>r.id===slot.recipeId);
        if(recipe){
          recipe.ingredients.forEach(ing=>{
            const key = ing.nom.trim().toLowerCase();
            if(!key) return;
            if(!needed[key]) needed[key] = {nom: ing.nom.trim(), qtys: []};
            const q = [ing.quantite, ing.unite].filter(Boolean).join(' ');
            if(q) needed[key].qtys.push(q);
          });
        }
      }
    });
  });

  const allStock = [...data.stock.congelateur, ...data.stock.frigo, ...data.stock.conserves];
  const stockNames = new Set(allStock.filter(s=>Number(s.quantite)>0 || !s.quantite).map(s=>s.nom.trim().toLowerCase()));

  const toBuy = Object.values(needed).filter(n=>!stockNames.has(n.nom.toLowerCase()));

  // conserve les articles manuels, remplace les articles auto
  const manualItems = data.courses.filter(c=>c.manuel);
  const autoItems = toBuy.map(n=>({
    id: uid(), nom: n.nom, quantite: n.qtys.join(', '), coche:false, manuel:false
  }));
  data.courses = [...autoItems, ...manualItems];
  saveData();

  if(!toBuy.length){
    toast('Tout ce dont tu as besoin est déjà en stock, ou aucun repas n\u2019est planifié cette semaine.');
  }
  render();
}

function attachCoursesEvents(){
  const main = document.getElementById('main');
  const gen = main.querySelector('[data-act="genCourses"]');
  if(gen) gen.onclick = generateCourses;

  const addBtn = main.querySelector('[data-act="addCourse"]');
  if(addBtn) addBtn.onclick = ()=>{
    const nameInp = main.querySelector('#newCourseName');
    const qtyInp = main.querySelector('#newCourseQty');
    if(!nameInp.value.trim()) return;
    data.courses.unshift({id:uid(), nom:nameInp.value.trim(), quantite:qtyInp.value.trim(), coche:false, manuel:true});
    saveData(); render();
  };

  main.querySelectorAll('[data-coursecheck]').forEach(cb=>cb.onchange=()=>{
    const item = data.courses.find(c=>c.id===cb.dataset.coursecheck);
    if(item){ item.coche = cb.checked; saveData(); render(); }
  });
  main.querySelectorAll('[data-coursedel]').forEach(b=>b.onclick=()=>{
    data.courses = data.courses.filter(c=>c.id!==b.dataset.coursedel);
    saveData(); render();
  });
  const clearBtn = main.querySelector('[data-act="clearChecked"]');
  if(clearBtn) clearBtn.onclick = ()=>{
    data.courses = data.courses.filter(c=>!c.coche);
    saveData(); render();
  };
}

      const nameInp = main.querySelector(`[data-newstockname="${zone.key}"]`);
      const qtyInp = main.querySelector(`[data-newstockqty="${zone.key}"]`);
      const unitInp = main.querySelector(`[data-newstockunit="${zone.key}"]`);
      if(!nameInp.value.trim()) return;
      data.stock[zone.key].push({id:uid(), nom:nameInp.value.trim(), quantite:Number(qtyInp.value)||1, unite:unitInp.value.trim()});
      saveData(); render();
    };
  });
  main.querySelectorAll('[data-stockinc]').forEach(b=>b.onclick=()=>{
    const [zone,id]=b.dataset.stockinc.split(':');
    const item = data.stock[zone].find(i=>i.id===id);
    if(item){ item.quantite = Number(item.quantite)+1; saveData(); render(); }
  });
  main.querySelectorAll('[data-stockdec]').forEach(b=>b.onclick=()=>{
    const [zone,id]=b.dataset.stockdec.split(':');
    const item = data.stock[zone].find(i=>i.id===id);
    if(item){ item.quantite = Math.max(0, Number(item.quantite)-1); saveData(); render(); }
  });
  main.querySelectorAll('[data-stockdel]').forEach(b=>b.onclick=()=>{
    const [zone,id]=b.dataset.stockdel.split(':');
    data.stock[zone] = data.stock[zone].filter(i=>i.id!==id);
    saveData(); render();
  });
}

document.getElementById('settingsBtn').addEventListener('click', ()=>{
  const html = `

    ${syncSectionHTML()}
    <div class="card">

      <button class="btn btn-soft btn-block" data-act="exportData">Exporter mes données (.json)</button>
      <label class="btn btn-ghost btn-block" style="margin-top:8px; text-align:center;">
        Importer une sauvegarde
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </label>
    </div>
    <div class="card">
      <div class="section-title">Réinitialiser</div>
      <p class="hint" style="margin-bottom:10px;">Efface toutes les recettes, menus, courses, stocks et l\u2019historique de cet appareil.</p>
      <button class="btn btn-danger btn-block" data-act="resetData">Tout effacer</button>
    </div>
  `;
  openModal(html, sheet=>{
    function reopenSettings(){ document.getElementById('settingsBtn').click(); }
    const forceBtn = sheet.querySelector('[data-act="forceSync"]');
    if(forceBtn) forceBtn.onclick = async ()=>{
      forceBtn.textContent = 'Envoi...'; forceBtn.disabled = true;
      await pushToCloudSilent();
      toast('Synchronisation forcée effectuée.');
      reopenSettings();
    };
    sheet.querySelector('[data-act="closeModal"]').onclick = closeModal;
    sheet.querySelector('[data-act="exportData"]').onclick = ()=>{
      const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `nos-menus-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    };
    sheet.querySelector('#importFile').addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const imported = JSON.parse(reader.result);
          data = Object.assign(defaultData(), imported);
          saveData();
          closeModal();
          render();
          toast('Sauvegarde importée.');
        }catch(err){
          alert('Ce fichier n\u2019a pas pu être lu.');
        }
      };
      reader.readAsText(file);
    });
    sheet.querySelector('[data-act="resetData"]').onclick = ()=>{
      if(confirm('Es-tu sûr(e) ? Cette action est irréversible.')){
        data = defaultData();
        saveData();
        closeModal();
        render();
      }
    };
  });
});

/* ============================================================
   DIVERS
============================================================ */
function esc(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let toastTimer;
function toast(msg){
  let el = document.getElementById('toastEl');
  if(!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.style.cssText = `position:fixed; left:50%; bottom:calc(96px + var(--safe-bottom)); transform:translateX(-50%);
      background:var(--text); color:#fff; padding:10px 16px; border-radius:99px; font-size:13px; z-index:200;
      max-width:80%; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,.2);`;
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; }, 2600);
}

function attachTabEvents(){
  if(currentTab==='menu') attachMenuEvents();
  else if(currentTab==='recettes') attachRecettesEvents();
  else if(currentTab==='courses') attachCoursesEvents();
  else if(currentTab==='stock') attachStockEvents();
  else if(currentTab==='historique') attachHistoriqueEvents();
}
